---
layout: base
---

<article
  class="post h-entry"
  itemscope
  itemtype="http://schema.org/BlogPosting"
>
  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">
      {{ page.title | escape }}
    </h1>
    <div class="post-meta">
      {%- assign date_format = "%Y/%m/%d" -%} {% assign pdate = page.date | date_to_xmlschema %} 
      {%- if page.modified_date %}<span class="meta-label">Published:</span>{% endif %}
      <time
        class="dt-published"
        datetime="{{ pdate }}"
        itemprop="datePublished"
      >
        {{ pdate | date: date_format }}
      </time>
    </div>
  </header>

  <div class="post-content e-content" itemprop="articleBody">{{ content }}</div>
</article>
